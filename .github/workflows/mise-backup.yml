# Mise 2.0 G2: the nightly encrypted backup (plan section 3, section 7 step 10).
#
# This file is reviewed with the code in the PUBLIC mise repo, but it RUNS
# ONLY in the private repo JannikSin/mise-backup: every job is guarded on the
# repository name, and the first step refuses unless the repository is
# private. In this public repo the schedule fires and the job is skipped.
#
# What it does, every night:
#   1. reads the snapshot SQL from the public mise code (tools/db-snapshot.mjs,
#      the same SQL the restore drill runs in PGlite);
#   2. runs it through psql as the read-only `mise_backup` role;
#   3. checks the snapshot and prints COUNTS ONLY (never a row);
#   4. encrypts it with age to David's public key and deletes the plaintext;
#   5. keeps the last 30 nights on ONE orphan branch `backups`, rewritten as a
#      single commit each night (no history past 30 days);
#   6. on any failure, one ntfy push with no data in it.
# This is also the second keep-alive (a real database read every night).
#
# Secrets (names only, set by David in the private repo, never committed):
#   MISE_BACKUP_DB_URL        the live project's pooler connection string for mise_backup
#   MISE_BACKUP_AGE_RECIPIENT David's age public key (age1...)
#   NTFY_TOPIC                optional, the phone alert topic
# Variable: MISE_CODE_REF (optional): the mise commit or branch to read the
# snapshot SQL from; default main.
name: mise-backup

on:
  schedule:
    - cron: "17 8 * * *" # 3:17 am Indiana in winter (EST), 4:17 am in summer
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mise-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == 'JannikSin/mise-backup'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Refuse unless this repository is private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)" = "true"

      - name: Read the snapshot tool from the public code
        uses: actions/checkout@v4
        with:
          repository: JannikSin/mise
          ref: ${{ vars.MISE_CODE_REF || 'main' }}
          path: mise
          sparse-checkout: tools
          persist-credentials: false

      - name: Install psql and age
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client age > /dev/null

      - name: Snapshot, check (counts only), encrypt
        env:
          MISE_BACKUP_DB_URL: ${{ secrets.MISE_BACKUP_DB_URL }}
          AGE_RECIPIENT: ${{ secrets.MISE_BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${MISE_BACKUP_DB_URL}" && test -n "${AGE_RECIPIENT}"
          node mise/tools/db-snapshot.mjs sql > "${RUNNER_TEMP}/snapshot.sql"
          psql "${MISE_BACKUP_DB_URL}" -X -q -At -v ON_ERROR_STOP=1 -f "${RUNNER_TEMP}/snapshot.sql" > "${RUNNER_TEMP}/plain.json"
          node mise/tools/db-snapshot.mjs check < "${RUNNER_TEMP}/plain.json"
          age -r "${AGE_RECIPIENT}" -o "${RUNNER_TEMP}/snapshot.json.age" "${RUNNER_TEMP}/plain.json"
          shred -u "${RUNNER_TEMP}/plain.json"
          test -s "${RUNNER_TEMP}/snapshot.json.age"

      - name: Keep 30 nights on the orphan branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          day="$(date -u +%Y-%m-%d)"
          mkdir store && cd store
          git init -q
          git config user.name "mise-backup"
          git config user.email "mise-backup@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # an existing branch MUST fetch, or tonight's push would drop the other 29 nights
          if git ls-remote --exit-code --heads origin backups > /dev/null; then
            git fetch -q --depth=1 origin backups
            git checkout -q FETCH_HEAD -- .
          fi
          cp "${RUNNER_TEMP}/snapshot.json.age" "mise-${day}.json.age"
          cutoff="$(date -u -d '30 days ago' +%Y-%m-%d)"
          for f in mise-*.json.age; do
            d="${f#mise-}"; d="${d%.json.age}"
            if [[ "${d}" < "${cutoff}" ]]; then rm -f -- "${f}"; fi
          done
          git add -A
          git commit -q -m "backup ${day}: $(ls mise-*.json.age | wc -l) night(s)"
          git push -q -f origin HEAD:refs/heads/backups
          echo "kept $(ls mise-*.json.age | wc -l) encrypted night(s)"

      - name: Alert the phone (no data in the message)
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "${NTFY_TOPIC}" ]; then
            curl -fsS -o /dev/null -H "Title: Mise backup failed" -d "Run ${GITHUB_RUN_ID} in ${GITHUB_REPOSITORY}. Open the Actions tab." "https://ntfy.sh/${NTFY_TOPIC}"
          fi
