# Mise 2.0 G2: the nightly encrypted backup (plan section 3, section 7 step 10).
#
# This file is reviewed with the code in the PUBLIC mise repo, but it RUNS
# ONLY in the private repo JannikSin/mise-backup: every job is guarded on the
# repository name, and the first step refuses unless the repository is
# private. In this public repo the schedule fires and the job is skipped.
#
# What it does, every night:
#   1. pins the public mise code to ONE commit SHA (the workflow_dispatch
#      input `code_sha`, else the variable MISE_CODE_REF), refused when it is
#      absent or not a full 40-character SHA: no branch, no default;
#   2. checks that commit out and writes the snapshot SQL and the table list
#      in a step that holds NO secret (actions/checkout is pinned by SHA too);
#   3. runs the SQL through psql as the read-only `mise_backup` role: the
#      only step with the database URL;
#   4. checks the snapshot with an inline script of THIS file (never public
#      code) and prints COUNTS ONLY (never a row);
#   5. encrypts it with age to David's public key;
#   6. keeps the last 30 nights on ONE orphan branch `backups`, rewritten as a
#      single commit each night (no history past 30 days);
#   7. on any failure, one ntfy push with no data in it.
# Plaintext: it exists only under /dev/shm/mise-backup (a tmpfs, checked;
# the run refuses when /dev/shm is not tmpfs), is shredded right after the
# encrypt, and an always() step shreds whatever is left if a step failed.
# Public code never runs while the database URL or the plaintext is present.
# This is also the second keep-alive (a real database read every night).
#
# Secrets (names only, set by David in the private repo, never committed):
#   MISE_BACKUP_DB_URL        the live project's pooler connection string for mise_backup
#   MISE_BACKUP_AGE_RECIPIENT David's age public key (age1...)
#   NTFY_TOPIC                optional, the phone alert topic
# Variable: MISE_CODE_REF (REQUIRED): the full commit SHA of the mise code
# whose tools/db-snapshot.mjs writes the snapshot SQL. Move it by hand after
# reviewing a change to that file.
name: mise-backup

on:
  schedule:
    - cron: "17 8 * * *" # 3:17 am Indiana in winter (EST), 4:17 am in summer
  workflow_dispatch:
    inputs:
      code_sha:
        description: "mise commit SHA to read the snapshot SQL from (default: the MISE_CODE_REF variable)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: mise-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == 'JannikSin/mise-backup'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Refuse unless this repository is private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)" = "true"

      - name: Pin the public code to one commit SHA (no secrets in this step)
        id: pin
        env:
          CODE_SHA: ${{ inputs.code_sha || vars.MISE_CODE_REF }}
        run: |
          set -euo pipefail
          if ! [[ "${CODE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "MISE_CODE_REF (or the code_sha input) must be a full 40-character commit SHA; refusing" >&2
            exit 1
          fi
          echo "sha=${CODE_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Check out that commit (no secrets in this step)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: JannikSin/mise
          ref: ${{ steps.pin.outputs.sha }}
          path: mise
          sparse-checkout: tools
          persist-credentials: false

      - name: Write the snapshot SQL and the table list, then set up tmpfs (no secrets in this step)
        run: |
          set -euo pipefail
          test "$(git -C mise rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
          node mise/tools/db-snapshot.mjs sql > "${RUNNER_TEMP}/snapshot.sql"
          node mise/tools/db-snapshot.mjs tables > "${RUNNER_TEMP}/tables.txt"
          test -s "${RUNNER_TEMP}/snapshot.sql" && test -s "${RUNNER_TEMP}/tables.txt"
          rm -rf mise
          test "$(findmnt -n -o FSTYPE --target /dev/shm)" = "tmpfs"
          install -d -m 700 /dev/shm/mise-backup

      - name: Install psql and age
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client age > /dev/null

      - name: Dump (the only step with the database URL)
        env:
          MISE_BACKUP_DB_URL: ${{ secrets.MISE_BACKUP_DB_URL }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${MISE_BACKUP_DB_URL}"
          psql "${MISE_BACKUP_DB_URL}" -X -q -At -v ON_ERROR_STOP=1 -f "${RUNNER_TEMP}/snapshot.sql" -o /dev/shm/mise-backup/plain.json

      - name: Check the snapshot, counts only (this file's own script, no secrets)
        run: |
          set -euo pipefail
          python3 - "${RUNNER_TEMP}/tables.txt" /dev/shm/mise-backup/plain.json <<'CHECK'
          # mise-backup check: begin
          import json, sys
          want = [t for t in open(sys.argv[1]).read().split() if t]
          try:
              s = json.load(open(sys.argv[2]))
          except Exception:
              sys.exit("the snapshot is not JSON")
          if not isinstance(s, dict) or s.get("format") != "mise-backup/1" or not want:
              sys.exit("the snapshot format is not mise-backup/1")
          tables, columns = s.get("tables") or {}, s.get("columns") or {}
          for t in want:
              if not isinstance(tables.get(t), list) or not isinstance(columns.get(t), list) or not columns.get(t):
                  sys.exit("the snapshot is missing a table")
          if not tables["public.profiles"] or not tables["public.docs"]:
              sys.exit("the snapshot is empty")
          for t in want:
              print(t, len(tables[t]))
          # mise-backup check: end
          CHECK

      - name: Encrypt, then shred the plaintext
        env:
          AGE_RECIPIENT: ${{ secrets.MISE_BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          test -n "${AGE_RECIPIENT}"
          age -r "${AGE_RECIPIENT}" -o "${RUNNER_TEMP}/snapshot.json.age" /dev/shm/mise-backup/plain.json
          shred -u /dev/shm/mise-backup/plain.json
          test -s "${RUNNER_TEMP}/snapshot.json.age"

      - name: Keep 30 nights on the orphan branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          day="$(date -u +%Y-%m-%d)"
          mkdir store && cd store
          git init -q
          git config user.name "mise-backup"
          git config user.email "mise-backup@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # an existing branch MUST fetch, or tonight's push would drop the other 29 nights
          if git ls-remote --exit-code --heads origin backups > /dev/null; then
            git fetch -q --depth=1 origin backups
            git checkout -q FETCH_HEAD -- .
          fi
          cp "${RUNNER_TEMP}/snapshot.json.age" "mise-${day}.json.age"
          cutoff="$(date -u -d '30 days ago' +%Y-%m-%d)"
          for f in mise-*.json.age; do
            d="${f#mise-}"; d="${d%.json.age}"
            if [[ "${d}" < "${cutoff}" ]]; then rm -f -- "${f}"; fi
          done
          git add -A
          git commit -q -m "backup ${day}: $(ls mise-*.json.age | wc -l) night(s)"
          git push -q -f origin HEAD:refs/heads/backups
          echo "kept $(ls mise-*.json.age | wc -l) encrypted night(s)"

      - name: Shred any plaintext left by a failed step
        if: always()
        run: |
          if [ -d /dev/shm/mise-backup ]; then
            find /dev/shm/mise-backup -type f -exec shred -u {} +
            rm -rf /dev/shm/mise-backup
          fi

      - name: Alert the phone (no data in the message)
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "${NTFY_TOPIC}" ]; then
            curl -fsS -o /dev/null -H "Title: Mise backup failed" -d "Run ${GITHUB_RUN_ID} in ${GITHUB_REPOSITORY}. Open the Actions tab." "https://ntfy.sh/${NTFY_TOPIC}"
          fi
