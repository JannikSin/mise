name = "mise-worker"
main = "src/index.js"
compatibility_date = "2026-07-01"
account_id = "bd5fef067bffb5780b2fd25770606075"
workers_dev = true
# no per-version preview URLs — one live origin, matching the CORS list in code
preview_urls = false

# Secrets (set via dashboard or `npx wrangler secret put`, NEVER here):
#   ANTHROPIC_API_KEY
#   MISE_DATA_TOKEN  (read-only fine-grained PAT on mise-data — cron reads)
#   NTFY_TOPIC       (unguessable ntfy.sh topic David's phone subscribes to)
#   KROGER_CLIENT_ID / KROGER_CLIENT_SECRET  (Kroger Developer API, /kroger/*)
#   KROGER_STATE_SECRET  (any long random string; HMACs the OAuth state, which
#                         is the ONLY thing stopping /kroger/cart/callback
#                         being an open redirect)
# Optional plain var, and the cart push stays dark (503) until it is set:
#   KROGER_REDIRECT_URI  https://<this-worker>/kroger/cart/callback — must ALSO
#                        be registered as a redirect URI on the Kroger app, and
#                        that app needs the cart.basic:write scope granted.
# Optional plain var, B4 (friend groups). Comma-separated "owner/repo" list of
# ADDITIONAL private data repos this Worker will authenticate against, e.g.
#   MISE_DATA_REPOS = "roommate/mise-data"
# Absent = only JannikSin/mise-data, which is today's behaviour exactly.
# This is the ONLY thing standing between the Worker and anyone on the
# internet who owns a private repo, so a name goes on this list as a
# deliberate decision, never to make an error message go away.
#   MISE_DATA_REPOS
# Optional plain vars to override models:
#   SCAN_MODEL / REMEDY_MODEL (default claude-sonnet-5 in code)

# hourly notification cron (meal/store/batch/check-in pings via ntfy);
# scheduled() no-ops silently until both notification secrets are set
[triggers]
crons = ["0 * * * *"]

# retain the structured hbp ledger lines (H1) + errors in the CF dashboard;
# without this, console.log output exists only under a live `wrangler tail`
[observability]
enabled = true
